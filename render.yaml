# Render Blueprint for the FastAPI backend (free plan).
services:
  - type: web
    name: fraudscope-api
    runtime: python
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fraudscope.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7   # matches local .venv; confirm Render supports it at deploy time
      - key: ALLOWED_ORIGINS
        sync: false     # set in the Render dashboard to the Vercel URL, e.g. https://your-app.vercel.app
      - key: LIVE_TIMEOUT_S
        value: "25"
